name: 生成 WARP MASQUE 配置

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名（WARP 后台显示用）
        required: false
        default: gh-actions
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'
      sync_worker:
        description: WARP 注册信息是否同步到 Worker，一般是在works中注册WARP失败时使用（需配置 WORKER_PUSH_URL secret）
        required: false
        default: 'false'
        

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest \
                | jq -r '.tag_name' | sed 's/^v//')
          echo "usque 版本 $VER"
          curl -sL -o usque.zip \
            "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque
          # 没有 config.json 时 usque version 会先打一条 error，不影响结果
          ./usque version 2>/dev/null | grep -i version || true

      - name: 注册设备并生成密钥
        run: |
          set -euo pipefail
          mkdir -p dist
          ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}"
          test -s config.json
          # 只打印非敏感字段，密钥不进日志
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          c = json.load(open("config.json"))
          out = {
            "privateKey": c["private_key"],
            "peerPublicKey": c["endpoint_pub_key"],
            "ipv4": c["ipv4"],
            "ipv6": c["ipv6"],
            "registeredAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("dist/warp-registration.json", "w") as f:
            json.dump(out, f)
          print("endpoint_v4 =", c["endpoint_v4"])
          print("endpoint_v6 =", c["endpoint_v6"])
          print("内网地址 =", c["ipv4"], "/", c["ipv6"])
          print("已生成 WARP 注册信息 JSON")
          PY

      - name: 生成 mihomo 配置
        run: python3 scripts/gen_masque.py config.json dist

      - name: 校验配置可加载
        run: |
          set -euo pipefail
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases \
                | grep -o 'https://[^"]*mihomo-linux-amd64-alpha[^"]*\.gz' | head -1)
          curl -sL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          mkdir -p check
          cp dist/warp-masque.yaml check/config.yaml
          # -t 只做配置解析校验，不起服务
          ./mihomo -t -d check
          echo "配置校验通过"

      - name: 推送到 Worker
        if: ${{ github.event.inputs.sync_worker == 'true' }}
        env:
          URL: ${{ secrets.WORKER_PUSH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "没配 WORKER_PUSH_URL，跳过推送。WARP 注册信息在 artifact 里，可手动粘贴。"
            exit 0
          fi
          test -s dist/warp-registration.json
          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "${URL%/}/warp" \
            --data-binary @dist/warp-registration.json)
          echo "HTTP $CODE"
          cat /tmp/resp.json; echo
          [ "$CODE" = "200" ] || { echo "推送失败"; exit 1; }

      - name: 打包凭据与配置
        run: |
          cp config.json dist/usque-config.json
          test -s dist/warp-masque.yaml
          test -s dist/warp-masque-shadowrocket.txt
          ls -l dist

      - name: 上传 artifact
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-config
          path: dist/
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          if-no-files-found: error
